version: 2
updates:
  # NuGet packages (main project + NeuralDeck.Tests). Minor/patch bumps are grouped into a
  # single weekly PR; majors (e.g. SharpHook, xUnit) arrive as individual PRs for review.
  - package-ecosystem: 'nuget'
    directories:
      - '/'
      - '/NeuralDeck.Tests'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    groups:
      avalonia:
        patterns:
          - 'Avalonia*'
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
