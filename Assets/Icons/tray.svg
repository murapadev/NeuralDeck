    <line x1="18" y1="20" x2="32" y2="32" stroke-opacity="0.55"/>
    <line x1="18" y1="32" x2="32" y2="32" stroke-opacity="0.55"/>
    <line x1="18" y1="44" x2="32" y2="32" stroke-opacity="0.55"/>
    <line x1="32" y1="32" x2="46" y2="22" stroke-opacity="0.55"/>
    <line x1="32" y1="32" x2="46" y2="42" stroke-opacity="0.55"/>
    <circle cx="18" cy="20" r="3.2"/>
    <circle cx="18" cy="32" r="3.2"/>
    <circle cx="18" cy="44" r="3.2"/>
    <circle cx="32" cy="32" r="4"/>
    <circle cx="46" cy="22" r="3.2"/>
    <circle cx="46" cy="42" r="3.2"/>
  </g>
</svg>
