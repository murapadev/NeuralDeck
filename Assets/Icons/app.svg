    <line x1="140" y1="352" x2="256" y2="352"/>
    <line x1="256" y1="160" x2="372" y2="208"/>
    <line x1="256" y1="160" x2="372" y2="304"/>
    <line x1="256" y1="256" x2="372" y2="208"/>
